version: '3.8'

services:
  wolverine-db:
    image: postgres:15-alpine
    container_name: wolverine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wolverine}
      POSTGRES_DB: ${POSTGRES_DB:-wolverine_intel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - wolverine_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wolverine_intel}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wolverine_pgdata:
    name: wolverine_intel_pgdata
